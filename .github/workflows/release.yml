# 发布：推送 v* 标签后自动构建三平台安装包并创建 GitHub Release
# 用法：git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest   # .msi / .exe 安装包
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖（仅 Ubuntu）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 先跑核心测试，通过才打包
        run: cargo test -p pdf-crop-core --release

      # tauri-action：自动读取 tauri.conf.json 的版本号，
      # 构建 Windows/macOS/Linux 安装包并发布 GitHub Release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: v__VERSION__
          releaseName: "PDF裁剪工具 v__VERSION__"
          releaseBody: "PDF 矩形注释裁剪工具。下载对应平台的安装包即可使用。"
          releaseDraft: false
          prerelease: false
