<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF 裁剪工具</title>
  <style>
    /* 简洁样式：与之前 Gradio 版视觉接近 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f5f6f8; color: #333; padding: 24px;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #888; margin-bottom: 18px; }
    .panel { background: #fff; border-radius: 10px; padding: 20px;
             box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .row { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; }
    .radio-group { display: flex; gap: 18px; flex-wrap: wrap; }
    .radio-group label { display: flex; align-items: center; gap: 5px;
                         margin: 0; font-size: 13px; }
    .check-group label { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%; padding: 8px 10px; border: 1px solid #d9d9d9;
      border-radius: 6px; font-size: 13px;
    }
    input[type="text"]:focus { outline: none; border-color: #4a7fd4; }
    .hint { font-size: 11px; color: #aaa; margin-top: 3px; }
    .file-row { display: flex; gap: 8px; }
    .file-row input { flex: 1; }
    button {
      padding: 8px 16px; border: none; border-radius: 6px;
      font-size: 13px; cursor: pointer; background: #e8e8e8; color: #333;
    }
    button:hover { background: #ddd; }
    button.primary {
      width: 100%; padding: 11px; background: #1e6f5c; color: #fff;
      font-size: 15px; margin-top: 6px;
    }
    button.primary:hover { background: #17604f; }
    button.primary:disabled { background: #9db8b1; cursor: not-allowed; }
    #result {
      margin-top: 14px; padding: 12px; border-radius: 6px;
      font-size: 13px; white-space: pre-wrap; display: none;
      max-height: 220px; overflow-y: auto;
    }
    #result.ok { display: block; background: #eef7f0; color: #1e6f5c; }
    #result.err { display: block; background: #fdecec; color: #c0392b; }
    .two-col { display: flex; gap: 16px; }
    .two-col > div { flex: 1; }
  </style>
</head>
<body>
  <h1>PDF裁剪</h1>
  <div class="subtitle">裁剪 PDF 中的矩形注释区域，矢量无损输出，支持 Word 式拼版排版</div>

  <div class="panel">
    <div class="row">
      <label>裁剪类型</label>
      <div class="radio-group" id="mode">
        <label><input type="radio" name="mode" value="annotation" checked />矩形注释裁剪</label>
        <label><input type="radio" name="mode" value="margin" />页边距裁剪</label>
      </div>
    </div>

    <div class="row check-group">
      <label><input type="checkbox" id="expandMode" />扩展模式（同页注释取并集整块裁剪）</label>
    </div>

    <div class="row">
      <label>排版方式</label>
      <div class="radio-group" id="layout">
        <label><input type="radio" name="layout" value="flow" checked />拼版排版（推荐打印）</label>
        <label><input type="radio" name="layout" value="per_region" />独立分页</label>
      </div>
      <div class="hint">拼版排版：所有裁剪区域像 Word 插图一样按顺序流式排列到 A4 页面</div>
    </div>

    <div class="row two-col">
      <div>
        <label>页码范围</label>
        <input type="text" id="pageRange" placeholder="留空 = 全部（示例：1-3,5）" />
      </div>
      <div>
        <label>输出位置</label>
        <input type="text" id="outputDir" placeholder="留空 = 与源文件同级目录" />
      </div>
    </div>

    <div class="row">
      <label>输入文件</label>
      <div class="file-row">
        <input type="text" id="inputFile" placeholder="点击右侧按钮选择 PDF 文件" readonly />
        <button id="pickBtn">选择文件</button>
      </div>
    </div>

    <button class="primary" id="submitBtn">提交</button>
    <div id="result"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
