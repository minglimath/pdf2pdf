[package]
name = "pdf-crop-tauri"
version = "0.1.0"
edition = "2021"
description = "PDF 矩形注释裁剪工具（Tauri 桌面版）"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.36"
pdf-crop-core = { path = "../core" }
